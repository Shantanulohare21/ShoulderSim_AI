version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: shouldersim-postgres
    environment:
      POSTGRES_USER: shouldersim
      POSTGRES_PASSWORD: shouldersim_password
      POSTGRES_DB: shouldersim
      POSTGRES_INITDB_ARGS: "-E UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shouldersim"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shouldersim-network

  # TimescaleDB (for time-series biomechanical data)
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: shouldersim-timescaledb
    environment:
      POSTGRES_USER: shouldersim
      POSTGRES_PASSWORD: shouldersim_password
      POSTGRES_DB: shouldersim_ts
    ports:
      - "5433:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shouldersim"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shouldersim-network

  # Redis (session state, job queues)
  redis:
    image: redis:7-alpine
    container_name: shouldersim-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shouldersim-network

  # MinIO (S3-compatible storage for DICOM files)
  minio:
    image: minio/minio:latest
    container_name: shouldersim-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shouldersim-network

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shouldersim-backend
    environment:
      - DATABASE_URL=postgresql://shouldersim:shouldersim_password@postgres:5432/shouldersim
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET=shouldersim-dicom
      - ENVIRONMENT=development
      - DEBUG=true
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./cache:/app/cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - shouldersim-network

  # Celery Worker (async simulation jobs)
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shouldersim-celery-worker
    command: celery -A app.tasks.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://shouldersim:shouldersim_password@postgres:5432/shouldersim
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET=shouldersim-dicom
      - ENVIRONMENT=development
    volumes:
      - ./backend:/app
      - ./cache:/app/cache
    depends_on:
      - postgres
      - redis
      - minio
    networks:
      - shouldersim-network

  # Celery Beat (scheduled tasks)
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shouldersim-celery-beat
    command: celery -A app.tasks.celery_app beat --loglevel=info
    environment:
      - DATABASE_URL=postgresql://shouldersim:shouldersim_password@postgres:5432/shouldersim
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      - redis
    networks:
      - shouldersim-network

  # MLflow (model registry and tracking)
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.7.1
    container_name: shouldersim-mlflow
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    command: mlflow server --backend-store-uri sqlite:///mlflow.db --default-artifact-root /mlflow
    networks:
      - shouldersim-network

  # Prometheus (monitoring)
  prometheus:
    image: prom/prometheus:latest
    container_name: shouldersim-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - shouldersim-network

  # Grafana (visualization)
  grafana:
    image: grafana/grafana:latest
    container_name: shouldersim-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./infra/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - shouldersim-network

  # Frontend (React)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: shouldersim-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - shouldersim-network

volumes:
  postgres_data:
  timescaledb_data:
  redis_data:
  minio_data:
  mlflow_data:
  prometheus_data:
  grafana_data:

networks:
  shouldersim-network:
    driver: bridge
